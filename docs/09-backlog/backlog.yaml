- id: phase-demo-05
  title: Demo content, runbook, reset tool and rehearsals
  plan: doc-live-demo
  sources:
  - doc-live-demo-requirements
  systems:
  - sys-demo-stage
  - sys-demo-overview
  owner: repository-owner
  status: queued
  priority: 1
  session_budget: 1
  depends_on:
  - phase-demo-01
  - phase-demo-02
  - phase-demo-03
  - phase-demo-04
  - phase-demo-06
  scope:
  - Write the final talking-points copy into the stage data file and the live-segment
    runbook in the rehearsal gate's step shape (orient, record an idea, triage it,
    plan beat, overview-skill rebuild, test — PROMPT-017), each step carrying its
    commands, its fallback action and a timebox, the timeboxes summing inside 15
    minutes (REQ-006 R09).
  - Build tools/demo_reset.py with OPS-013, with two subcommands — prepare (regenerate
    overview outputs, clear scratch state, park the pre-built overview skill, seed
    the fallback audience idea through tools/append_idea.py) and restore (put the
    parked skill back and regenerate from current data) — without ever deleting or
    rewriting idea-log content or governed documents. Page bytes regenerate forward
    from the append-only log; only the skill returns to its pre-built state.
  - Write the Windows machine setup checklist per PLAN-021, including the pre-demo
    git tag step and screen hygiene, and run the REQ-006 R06 terminal smoke check on
    the presentation machine.
  - Run two timed dry-runs of the live segment and record per-step times in the
    runbook.
  acceptance:
  - Both dry-runs complete within 15 minutes with every step inside its timebox, and
    their times are recorded in the runbook (REQ-006 R09).
  - The R06 smoke check on the presentation machine is recorded as passing in the
    runbook.
  - demo_reset.py prepare parks the skill, seeds the fallback idea without
    duplication, and regenerates outputs; demo_reset.py restore returns the
    pre-built skill byte-identical; both are double-run idempotent and never delete
    or rewrite idea-log content or governed documents — the only idea-log access is
    appending through tools/append_idea.py.
  verification:
  - uv run pytest
  - uv run ruff check src/ test/
  - uv run mypy src/
  - uv run python -m src.governance
  - uv run python tools/check_no_private_content.py with the changes staged
  - Adversarial review (demo-adversary, pack D05-A) with findings fixed or explicitly
    reported (GOV-003 demo-track completion gate)
  - Playwright rehearsal pass over the runbook's browser-marked steps (demo-validator-web,
    pack D05-W)
  deliverables:
  - ts/public/talking-points.json
  - tools/demo_reset.py
  - docs/08-governance/OPS-013-demo-reset.md
  - docs/08-governance/codes.yaml
  - docs/08-governance/catalog.md
  - docs/00-working/demo-runbook.md
  - docs/00-working/demo-windows-setup.md
  next_action: 'Claim released 2026-09-10 with zero commits on agent/phase-demo-05
    (worktree kept) when the owner folded phase-demo-06 into the track ahead of the
    rehearsals; re-claim after phase-demo-06 completes, then draft the runbook
    timeboxes from the PROMPT-010 live-segment shape and build demo_reset.py so the
    first dry-run can already use it.'
- id: phase-demo-06
  title: Stage terminal interaction — session tabs, guarded drop, command injection
  plan: doc-live-demo
  sources:
  - doc-live-demo-requirements
  systems:
  - sys-demo-stage
  owner: repository-owner
  agent: agent-demo-stage
  status: complete
  priority: 1
  session_budget: 1
  depends_on:
  - phase-demo-01
  - phase-demo-02
  - phase-demo-03
  - phase-demo-04
  scope:
  - Host up to four terminal sessions as tabs in the terminal region, each an
    independent shell over its own websocket; keep every session's component mounted
    (CSS-hidden when inactive) so tab switches and region collapse never terminate a
    session (REQ-006 R10).
  - Separate collapse from drop — collapse hides the region with sessions intact;
    the drop control (descope rung 4) and closing an individual tab each require an
    explicit confirmation before the session terminates (REQ-006 R11).
  - Build the command list revealed in place within the terminal region, loaded from
    ts/public/demo-commands.json with no command text hardcoded in components;
    selecting an entry sends its command into the active terminal's websocket
    without a trailing newline (entries with run true append one); degrade cleanly
    when the terminal route is absent (REQ-006 R12).
  - Wire resize end to end — the frontend fit sends a JSON control frame the
    websocket route parses into the adapter's resize(); binary frames stay raw
    input; malformed text frames are ignored safely. No new endpoints, one PTY per
    websocket, ADR-013's gating and binding unchanged.
  acceptance:
  - A long-running command in one tab survives switching tabs and collapsing and
    re-expanding the region, and a fifth tab cannot be opened (REQ-006 R10).
  - Nothing terminates a session before its confirmation step; the confirmed drop
    and tab close genuinely terminate with no orphaned shell processes (REQ-006 R11).
  - An injected command appears un-executed on the active tab's input line, a run
    true entry executes on selection, and editing demo-commands.json changes the
    list with no page-code rebuild (REQ-006 R12).
  - A resize in the browser reaches the PTY (adapter resize called), proven by a
    test.
  verification:
  - cd ts && npm run build
  - uv run pytest
  - uv run ruff check src/ test/
  - uv run mypy src/
  - uv run python -m src.governance
  - uv run python tools/check_no_private_content.py with the changes staged
  - Adversarial review (demo-adversary, pack D06-A) with findings fixed or explicitly
    reported (GOV-003 demo-track completion gate)
  - Playwright browser verification (demo-validator-web, pack D06-W) covering session
    persistence, the confirmation guards, injection and zero-scroll at the four sizes
  deliverables:
  - ts/src
  - ts/public/demo-commands.json
  - src/api/routes/demo_terminal.py
  - test/test_demo_terminal.py
  next_action: 'None — phase complete: both fix cycles green (D06-A blocker and
    majors; D06-W collapse path), the coordinator''s targeted browser re-check and
    live-edit check passed, and the branch integrated into dev with the owner''s
    approval (GOV-003 demo-track completion gate, extended to this phase by the
    phase-demo-06 insertion decision).'
  session: doc-session-demo-stage-terminal-interaction
  completion_evidence:
  - src/api/routes/demo_terminal.py
  - test/test_demo_terminal.py
  - ts/src/stage/TerminalRegion.tsx
  - ts/src/stage/CommandPanel.tsx
  - ts/public/demo-commands.json
  result: 'All three creator/validator item pairs (D06-C1/V1, D06-C2/V2, D06-C3/V3)
    pass with no findings, each committed narrowly on agent/phase-demo-06. D06-G
    (phase gate, run and resumed once after a truncated first pass) confirmed:
    governance OK; check_no_private_content OK with changes staged; all four
    deliverables exist; npm run build, ruff and mypy all clean; no placeholder
    command string from demo-commands.json leaks into ts/src; the diff against dev
    touches only the phase''s declared deliverable paths. The coordinator''s D06-A
    adversarial review then found one blocker (embedded-newline injection bypassing
    run:false) and two majors (unbounded resize crashing the session; abrupt
    disconnect orphaning the shell) — all three fixed and independently validated
    (commits e474ccb, 2e6fda3), plus one minor (no session registry at the
    websocket route bounding the four-session cap) recorded against idea 000087
    per the coordinator''s explicit instruction, not fixed. The coordinator''s D06-W
    Playwright browser verification then confirmed session persistence, both R11
    guards with /proc-level termination proof, R12 injection semantics and
    zero-scroll at all four sizes on measured evidence, but found R10
    collapse/re-expand broken (the collapse control''s CSS hid its own re-expand
    toggle, leaving no UI path back) — fixed with a one-file CSS-scope narrowing
    (commit bde64df) and independently validated. Full re-verification after both
    fix cycles: uv run pytest 476 passed (the earlier catalog-drift failure is
    resolved on this branch, see the session record); ruff and mypy clean; npm run
    build clean. Not marking the phase complete; the coordinator''s re-run of the
    fixed collapse path, their demo-commands.json live-edit check, and integration
    into dev all remain outstanding and require the coordinator/owner, not this
    orchestrator. Completion (coordinator, post-integration): the targeted browser
    re-check passed the fixed collapse path with real clicks and zero-scroll held
    in both states; the live-edit check confirmed an appended demo-commands.json
    entry appears and injects un-executed with no rebuild; the branch was rebased
    onto dev (three checkpoint conflicts resolved keeping both sides) and
    integrated fast-forward at 0f1723c with the owner''s approval; final
    verification on dev: 476 tests pass, governance OK, staged private-content
    check OK.'
- id: phase-demo-07
  title: Skills-and-agents glossary and diagram library
  plan: doc-live-demo
  sources:
  - doc-live-demo-requirements
  systems:
  - sys-brain
  - sys-portfolio
  owner: repository-owner
  status: active
  agent: agent-demo-glossary
  priority: 1
  session_budget: 1
  depends_on: []
  scope:
  - Add brain/concepts/terms-skills-and-agents-demo.md, one concept memory following the
    terms-systems-vocabulary.md grouped-entry convention, tagged demo-glossary, defining
    the seventeen terms finalized by the PROMPT-019 audit — LLM, Token, Context, Prompt
    and system prompt, Tool, Tool call, Agent, Agentic loop, Sub-agent, Orchestration and
    multi-agent, Skill, Progressive disclosure, Command, MCP, MCP server, Session, Memory
    — each defined against this repository's actual .claude/ and .mcp.json conventions
    rather than generically, plus a one-line entry for the advanced topics named out of
    scope for depth (Hooks, Agent permissions, Observability, Agent SDK) (REQ-006 R13).
  - Register the demo-glossary tag in _data/tags.json (category context). The governance
    check rejects any memory tag absent from that taxonomy, so without this the phase
    fails its own first verification command.
  - Regenerate both glossaries — the committed unfiltered docs/08-governance/GLOSSARY.md,
    which goes stale the moment any concept memory is added and is asserted by
    test/test_glossary.py, and the filtered view at docs/00-working/demo-glossary.md
    (docs/00-working per ADR-010 — regenerable working output, not the canonical
    committed glossary OPS-004 governs).
  - Build six standalone SVG diagrams under docs/07-architecture/diagrams/demo/ — LLM vs
    agent, skill architecture (YAML front matter, SKILL.md, directory structure, assets),
    the agentic loop, sub-agents and context isolation, MCP architecture, and the
    command/skill/tool distinction — each legible at a projector-safe 1024x768 with no
    external asset or network dependency, plus an index.html contact sheet linking them
    with a one-line caption each and a pointer to it from docs/07-architecture/README.md.
    The index is HTML rather than a README.md because docs/ subdirectories are not exempt
    from the governance front-matter scan, and because the presenter opens it from the
    filesystem with no dev server running.
  acceptance:
  - Every term the owner listed (LLM, Agent/Sub-Agent, Tool, MCP, Context, Command, Skill)
    and every addition the PROMPT-019 audit finalized has a concept entry; the regenerated
    filtered glossary lists all of them (REQ-006 R13).
  - Each of the six SVGs opens standalone in a browser from the filesystem with no dev
    server, is legible at 1024x768, and its labels match the corresponding glossary
    entry's terminology exactly.
  - Running both glossary generations twice against an unchanged repository produces
    byte-identical output, and test/test_glossary.py passes.
  verification:
  - uv run python -m src.governance
  - uv run python tools/generate_glossary.py (unfiltered; run twice, diff empty)
  - uv run python tools/generate_glossary.py --tag demo-glossary --out docs/00-working/demo-glossary.md
    (run twice, diff empty)
  - uv run pytest test/test_glossary.py
  - uv run python tools/check_no_private_content.py with the changes staged
  - Visual review of each SVG and of index.html in a browser at 1024x768
  deliverables:
  - brain/concepts/terms-skills-and-agents-demo.md
  - _data/tags.json
  - docs/08-governance/GLOSSARY.md
  - docs/00-working/demo-glossary.md
  - docs/07-architecture/diagrams/demo
  - docs/07-architecture/README.md
  next_action: Claim the phase and write the concept memory first — the diagrams take
    their labels from its entries, and the acceptance check is that they match exactly.
    Content-only phase, no lock on sys-demo-stage or sys-demo-overview, so it can run
    alongside phase-demo-05/06.
