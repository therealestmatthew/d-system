  scope:
  - "Build a thin wrapper script (e.g. tools/triage_annotate.py) that the idea-triage\
    \ subagent calls instead of tools/append_idea.py annotate directly. The wrapper\
    \ reads the target idea id from a per-dispatch file the driver writes immediately\
    \ before invoking the subagent — never from an argument the subagent itself\
    \ supplies — so a confused subagent has no path to write to the wrong idea's\
    \ record, unlike the two prompt-level guardrails already in place (see\
    \ SESS-2026-09-08-18's addendum for the full design writeup and the concrete bug\
    \ that motivates this)."
  - Update .claude/commands/idea-triage.md to create and clean up the per-dispatch pin
    file around each subagent call, and .claude/agents/idea-triage.md to call the
    wrapper instead of the raw CLI.
  - "Investigate, as a possibly-complementary second layer (not a substitute): a\
    \ PreToolUse hook blocking Bash calls to append_idea.py whose idea id doesn't\
    \ match the current dispatch's pin file, correlated via Claude Code's per-dispatch\
    \ agent_id. Confirmed feasible in principle (hooks fire inside subagents and carry\
    \ agent_id/agent_type) but has two open risks to resolve before relying on it:\
    \ command-pattern matching is documented as best-effort against shell variable\
    \ expansion, and there is a race window between the Agent tool call returning its\
    \ agent_id and the subagent's first tool call. If either risk can't be closed\
    \ cleanly, ship the wrapper script alone and drop the hook rather than force it."
  - Confirm whether the maxTurns frontmatter field actually takes effect in a fresh
    session (bumped 15 -> 30 in phase-idea-02's closing session without confirmed
    effect within that same session — see the addendum) and adjust if not.
  acceptance:
