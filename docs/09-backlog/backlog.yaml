    write, created on the first checkpoint and updated by every run after it.
  - Cover verification output as actually observed, session record with an allocated
    code, backlog status and evidence, next_up pruning, catalog regeneration and the
    governance check.
  - Make the incomplete path the ordinary one - a phase whose acceptance is unmet
    stays queued or active with an honest next_action, and the skill never claims
    completion that is not there.
  - Work in the primary checkout with no remote, and scope the worktree and rebase
    steps to sessions that actually use a worktree.
