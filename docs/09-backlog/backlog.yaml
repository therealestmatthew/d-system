    lines, status left untouched) is unchanged for the normal, correct case.
  - The hook investigation's two open risks are either resolved and the hook shipped,
    or explicitly written up as not worth shipping and dropped — not left silently
    unresolved.
  verification:
  - uv run pytest
  - uv run python -m src.governance
  deliverables:
  - tools/triage_annotate.py
  - .claude/agents/idea-triage.md
