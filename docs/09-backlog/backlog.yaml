- id: phase-arch-01
  title: Settle the workbench vocabulary and rule on identifier migration
  plan: doc-workbench-architecture-quality
  sources:
  - doc-workbench-architecture-quality-requirements
  systems:
  - sys-brain
  - sys-wb-layout
  owner: repository-owner
  agent: agent-arch-vocab
  status: complete
  priority: 1
  session_budget: 1
  depends_on: []
  scope:
  - Add brain/concepts/terms-workbench-ui.md defining slot, panel, region, layout, assignment,
    visible panel, session, panel type, template family, generated page and overview, and
    regenerate docs/08-governance/GLOSSARY.md from it.
  - State explicitly which of slot and panel is the container, settling the question 000135
    and 000141 both defer to.
  - Rule, per identifier class, whether existing names are renamed or aliased - layout slot_id
    values, CSS class names, REQ-007 row wording, localStorage keys, panel registry ids and
    test fixtures.
  - Create no second glossary document; the generated glossary is the only rendered view.
  acceptance:
  - REQ-011 R01 holds - all eleven terms appear in the regenerated glossary and the drift test
    passes.
  - REQ-011 R02 holds - one sentence names the container explicitly.
  - REQ-011 R04 holds - each of the six identifier classes carries a rename-or-alias
    disposition with a reason.
  verification:
  - uv run python tools/generate_glossary.py
  - uv run pytest
  - uv run python -m src.governance
  deliverables:
  - brain/concepts/terms-workbench-ui.md
  - docs/08-governance/GLOSSARY.md
  next_action: Write the container-versus-content ruling first. Six ideas wait on that one
    sentence, and every other term in the file is phrased against it.
  session: doc-session-settle-workbench-vocabulary
  completion_evidence:
  - brain/concepts/terms-workbench-ui.md
  - docs/08-governance/GLOSSARY.md
  - docs/03-sessions/SESS-2026-09-15-01-settle-workbench-vocabulary.md
  result: >-
    Ruled that a slot is the container and a panel is its content - a slot is a named region of a
    layout's grid, a panel is a unit of content assigned into exactly one slot at a time - settling
    the question 000135 left open and that 000141 and 000144 presuppose. Resolved 000135's doubt
    rather than overriding it: the containment it noticed is real one tier down, so element was
    added as the tier a panel contains. Defined the eleven terms in brain/concepts/terms-workbench-
    ui.md and regenerated the glossary through the existing generator; no second glossary document.
    Session and region are qualified headings because both nouns already carry other senses in the
    same rendered file. Ruled all six identifier classes: layout slot_id values, localStorage field
    names and test fixtures renamed; CSS class names, REQ-007 row wording and panel registry ids
    aliased. Executed no rename - phase-arch-02 owns that. Slot ids become
    primary/secondary/strip/explorer under a rule that a slot id names its role and may never equal
    a panel id, which also discharges a collision REQ-011 R03 does not record: terminal and notes-
    strip are each simultaneously a slot_id and a panel_id in both shipped layouts. Verification
    green (580 passed, governance OK, glossary regeneration leaves no drift) and an independent sub-
    agent review of 2d9290f..e76a385 found all three conditions met with no discrepancies.
