  result: 'validate_sources runs as the first statement of rebuild(), before mkdir,
    connect and the eight DROP statements. Checked against the real tree: a project
    file carrying an out-of-range date and the retired cadence value printed both
    problems with file and field, exited 1, and left the existing 33 project rows
    intact; a Markdown file with no front matter reported missing YAML front matter
    and exited 1. 37 focused tests and 264 in total pass; ruff, mypy and governance
    are clean. The first run found every brain entry failing because PyYAML resolves
    unquoted dates to date objects, which the validator now normalizes rather than
    rewriting seven files. The loader read of the cadence field was corrected to review_cadence,
    which phase-cap-02 renamed; without it the rebuild would have written null for
    all 33 projects and reported success.'
