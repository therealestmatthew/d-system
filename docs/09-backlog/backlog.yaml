    overview-*.html precedent rather than introducing a parallel look (REQ-027 R09).
  - Render all eleven Markdown deliverables faithfully - headings, ordered and unordered lists,
    tables, fenced code, inline code, blockquotes and links - and verify against all eleven,
    not a sample. 01-13 names thirteen files but only eleven are Markdown; 03 and 04 are CSVs
    and belong to REQ-027 R03. 05 and 06 carry nested tables inside blockquotes and are the
    hard cases.
