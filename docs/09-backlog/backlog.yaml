- id: phase-idg-14
  title: Build the terminal-state authority process - propose, verify, ratify
  plan: doc-idea-graph-lifecycle
  sources:
  - doc-idea-graph-lifecycle-requirements
  - doc-idea-graph-lifecycle
  systems:
  - sys-contracts
  - sys-portfolio
  owner: repository-owner
  status: queued
  priority: 1
  session_budget: 1
  depends_on:
  - phase-idg-01
  scope:
  - Build the two-agent authority process for reaching a terminal state (delivered, resolved or
    absorbed), per the owner's 2026-09-22 ruling raised by idea 000236 - an agent proposes the close
    with its evidence (a pointer), a second agent verifies the pointer resolves, and the owner
    ratifies a queue of them in one sitting. This is the first agent-writable terminal transition in
    the idea log.
  - 'Mark provenance with a proposed_by: agent|owner field on the status event (owner-named shape,
    batch-003 Q6), so a reader can always tell a ratified close from an unratified one.'
  - 'An agent-written close announces itself as awaiting review and never blocks: downstream work
    proceeds on the closed idea, and the owner''s ratification catches up in batch.'
  - Consume phase-irs-13's gate queue for the owner's batched ratification once it ships, but do not
    depend on it - the marking mechanism must stand alone until then.
  acceptance:
  - 'The log distinguishes an agent-written terminal state from an owner-ratified one, through a
    field.'
  - 'A close proposed by one agent is verified by a second agent, who confirms the cited pointer
    resolves, before it is treated as ratified; a close missing either step remains marked as
    agent-written rather than ratified.'
  - 'Pending (unratified) closes are derivable from the log by any consumer without phase-irs-13''s
    gate queue existing - that queue is the intended presentation once it ships, not a build
    dependency of this phase.'
  verification:
  - uv run pytest
  - uv run python -m src.governance
  deliverables:
  - schemas/idea.schema.json
  - tools/append_idea.py
  - src/db/ideas.py
  - test/
  - .claude/agents/
  next_action: 'Split out of phase-idg-01 on 2026-09-23 by owner ruling (batch-003 Q4) - the schema
    change and the authority process are two different failure modes, the same reasoning that split
    phase-idg-13 out on 2026-09-22. Do not start before phase-idg-01 ships the terminal statuses and
    their pointer requirement; there is nothing to propose a close into until then. The agent that
    writes a terminal-state close surfaces it in its own report, so the owner does not have to notice
    a status change in the log by reading it - this requirement lives here as a next_action rather
    than in acceptance because no test can read an agent''s report text (batch-003 Q5). Neither the
    existing status event nor a linked event carries an author field, which is why the proposed_by
    field is being added rather than reused (batch-003 Q6). One delivered, two paths into it:
    phase-irs-09 plans a second path into delivered, written after the realization pipeline''s own
    verification, and whoever builds either phase reads the other first (GOV-003, 2026-09-22 lifecycle
    ruling).'
