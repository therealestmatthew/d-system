    marked complete.
  - A second run updates the existing session record rather than creating a second
    one.
  - Following it leaves the governance check green and the catalog current.
  - CLAUDE.md and AGENTS.md both reference the skill, so an agent can know to invoke
    it unprompted.
  - No governed document still forbids the primary checkout unconditionally.
  verification:
