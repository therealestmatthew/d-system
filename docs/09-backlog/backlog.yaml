  acceptance:
  - For each of the eleven Markdown deliverables the rendered output contains no line beginning
    with '## ' or '- ' outside a pre block, and the count of h2 elements equals the count of
    '^## ' in the source.
  - Every Markdown table in every source deliverable produced a table element.
  - All fourteen deliverables are reachable from the entry page, the thirteen in at most two
    clicks and the ledger directly.
  verification:
  - uv run python -m src.governance
  - uv run pytest
  deliverables:
