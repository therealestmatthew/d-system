schema_version: 1
updated: '2026-09-12'
# Ideas the demo fast lane consumed, and what became of each.
#
# The fast lane runs outside the idea-batching prompt pack entirely (PROMPT-025
# decision 2): demo-blocking and demo-improving ideas are cut, ranked and handed to
# the build already in flight, and the pack does not wait for it. This file is the
# seam between the two lanes. The pack's corpus builder reads it and removes every
# id listed here with a disposition of `queued` or `fixed` from the batching corpus.
#
# `dropped` is the important case. PROMPT-025 decision 14: an idea the fast lane
# considered but does not ship must RETURN to the batching corpus rather than fall
# between the two lanes. A dropped entry is therefore a record of a decision, not an
# exclusion - the corpus builder must NOT remove it. It is listed so the batching
# session can see the fast lane looked at it and why it passed, without having to
# reconstruct that from conversation.
#
# A missing file is not an error. The corpus builder treats absence as an empty
# exclusion set, which is what keeps the two workstreams independent.
#
# Cut drafted and ratified 2026-09-12 (items 1-4 of the ranked cut ship; 5-8 dropped).
# Audience: novice practitioners. Subject: skills and agents. Demo: 2026-09-15.

dispositions:
  queued: Handed to the in-flight build as a backlog phase. Removed from the corpus.
  fixed: Fixed directly in the fast lane, no phase. Removed from the corpus.
  dropped: Considered by the fast lane and not shipped. RETURNS to the corpus.

consumed:

