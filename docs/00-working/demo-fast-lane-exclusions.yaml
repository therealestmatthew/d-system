# --- Measured, not consumed --------------------------------------------------
# 000099 and 000129 were investigated by the fast lane and are NOT excluded. Six
# consecutive full-suite runs on 2026-09-12 (five in the primary checkout on dev, one
# in an isolated worktree) produced ZERO PTY failures; the three tests 000099 names
# never failed. ~/.pyenv/shims/.pyenv-shim did not exist during the measurement,
# consistent with both ideas' environmental diagnosis but not proof of it - the lock
# recurs under concurrent agent load. 000099 is resolved in current conditions.
# 000129 stays open as "make the tests immune to the shim so gates stop carrying the
# caveat", which is batch work, not demo work. Both remain in the corpus.
#
# 000093 (governance atlas page) is excluded from the demo by owner ruling and was
# not reconsidered. It is not listed here because that ruling is about the demo, not
# about the batch.
#
# 000104 and 000112 are absent deliberately: both were already built (phase-wb-08 at
# bf1749b, and the File Browser right-click menu respectively) and both already carry
# promoted_to: PLAN-022 in the idea log, so the corpus builder's own promoted-state
# filter should drop them without help from this file.
