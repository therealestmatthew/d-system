<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-label="MCP architecture">
  <title>MCP architecture</title>
  <desc>The application is the MCP client; MCP servers expose tools over the protocol, and they arrive in the model's tool list beside the built-in ones.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #0f172a; }
      .head { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .box { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .code { font-size: 17px; fill: #0f172a; }
      .small { font-size: 16px; fill: #475569; }
      .band { font-size: 20px; font-weight: 700; fill: #6d28d9; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .model { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
      .tool { fill: #dcfce7; stroke: #15803d; stroke-width: 2.5; }
      .srv { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.5; }
      .srv2 { fill: #ffffff; stroke: #6d28d9; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .protocol { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1024" height="768" fill="#ffffff"/>
  <text class="title" x="512" y="46" text-anchor="middle">MCP architecture</text>

  <rect class="model" x="352" y="72" width="320" height="62" rx="10"/>
  <text class="box" x="512" y="111" text-anchor="middle">Model</text>
  <path class="edge" d="M 512 134 V 182"/>

  <rect class="panel" x="60" y="186" width="904" height="180" rx="12"/>
  <text class="head" x="84" y="218">Application — Claude Code, acting as the MCP client</text>

  <rect class="tool" x="90" y="234" width="392" height="96" rx="10"/>
  <text class="box" x="286" y="270" text-anchor="middle">Built-in tools</text>
  <text class="code mono" x="286" y="302" text-anchor="middle">Read · Bash · Edit · Grep</text>

  <rect class="tool" x="542" y="234" width="392" height="96" rx="10"/>
  <text class="box" x="738" y="270" text-anchor="middle">Tools from MCP servers</text>
  <text class="code mono" x="738" y="302" text-anchor="middle">mcp__playwright__browser_click</text>

  <text class="small" x="512" y="352" text-anchor="middle">The model sees one flat list of tools and calls them the same way. Only the naming shows where they came from.</text>

  <path class="edge" d="M 760 366 V 384"/>

  <rect class="protocol" x="60" y="388" width="904" height="48" rx="10"/>
  <text class="band" x="84" y="419">Model Context Protocol — one interface, any client, any server</text>

  <path class="edge" d="M 300 436 V 466"/>
  <path class="edge" d="M 760 436 V 466"/>

  <rect class="srv" x="140" y="470" width="320" height="128" rx="12"/>
  <text class="box" x="300" y="508" text-anchor="middle">MCP server</text>
  <text class="code mono" x="300" y="540" text-anchor="middle">playwright</text>
  <text class="small" x="300" y="572" text-anchor="middle">navigate · click · snapshot</text>

  <rect class="srv2" x="600" y="470" width="320" height="128" rx="12"/>
  <text class="box" x="760" y="508" text-anchor="middle">Another MCP server</text>
  <text class="small" x="760" y="540" text-anchor="middle">a database, an issue tracker,</text>
  <text class="small" x="760" y="566" text-anchor="middle">your own service — same protocol</text>

  <text class="head" x="512" y="646" text-anchor="middle">The whole declaration in this repository: <tspan class="mono">.mcp.json</tspan></text>
  <text class="code mono" x="322" y="682">{ "mcpServers": { "playwright": {</text>
  <text class="code mono" x="352" y="708">"command": "npx",</text>
  <text class="code mono" x="352" y="734">"args": ["@playwright/mcp@latest"] } } }</text>
</svg>
