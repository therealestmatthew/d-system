- {id: demo-creator-web, kind: subagent, status: available, agent_file: .claude/agents/demo-creator-web.md}
- {id: demo-orch-content, kind: subagent, status: available, agent_file: .claude/agents/demo-orch-content.md}
- {id: demo-orch-data, kind: subagent, status: available, agent_file: .claude/agents/demo-orch-data.md}
