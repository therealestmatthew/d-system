# Agent definitions: how to start each agent (GOV-023 Agent definitions). A subagent definition
# points at its .claude/agents file, which supplies model, effort and tools. Checked by
# schemas/fleet-definition.schema.json and test/test_fleet_files.py.
schema_version: 1
definitions:
# --- sessions ---
- id: repo-session
  kind: session
  status: available
  permission_mode: auto
  cwd: .
  remote_control: true
  launcher: tab
  notes: An interactive session in the primary checkout with the default model. The interim
    roster (_working/session-manager/sessions.json) starts eight sessions this way.
- id: advisor
  kind: session
  status: available
  model: fable
  effort: medium
  permission_mode: dontAsk
  allowed_tools:
  - Read
  - Grep
  - Glob
  - WebSearch
  - WebFetch
  - ToolSearch
  - ListAgents
  - SendMessage
  - Bash(git log *)
  - Bash(git show *)
  - Bash(git diff *)
  - Bash(git status *)
  - Bash(git worktree list *)
  - Bash(git ls-remote *)
  - Bash(git rev-parse *)
  - Bash(git branch --list *)
  - Bash(ls *)
  - Bash(cat *)
  - Bash(head *)
  - Bash(tail *)
  - Bash(wc *)
  - Bash(grep *)
  - Bash(rg *)
  disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow, Artifact]
  cwd: .
  remote_control: true
  launcher: tab
  notes: Read-only advisor, as _working/session-manager/open-advisor.sh launches it.
- id: replicator
  kind: session
  status: available
  permission_mode: manual
  cwd: .
  remote_control: true
  launcher: tab
  notes: The Agent Replicator (PLAN-054 D10). Manual mode, so the owner approves every launch and kill.
- id: owner-terminal
  kind: owner-manual
  status: available
  permission_mode: manual
  cwd: ..
  remote_control: true
  launcher: tab
  notes: The Owner Terminal (GOV-017). Started by the owner in the directory above the repository.
# --- subagents with an agent file ---
- {id: demo-adversary, kind: subagent, status: available, agent_file: .claude/agents/demo-adversary.md}
