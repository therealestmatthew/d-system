# The fleet: host facts, enabled orchestration systems, launch defaults, and the roles that serve
# every system. Defined by GOV-023; checked by schemas/fleet.schema.json and test/test_fleet_files.py.
# phase-rep-07 adds the three system files and enables them here.
schema_version: 1
model_document: docs/08-governance/GOV-023-fleet-model.md
host:
  os: linux
  terminal_launcher: gnome-terminal
  projects_dir: ~/.claude/projects
  repo_root: /code/d-system
enabled_systems: []
defaults:
  permission_mode: auto
  remote_control: true
  launcher: tab
fleet_roles:
- id: replicator
  definition: replicator
  group: meta
  cardinality: {min: 0, max: 1}
  lifecycle: owner-only
  session_names: [Replicator]
  notes: Launches, kills and restarts the other agent sessions on authorised requests (PLAN-054 D10).
    The owner starts it from the desktop, because opening tabs needs a display.
- id: owner-terminal
  definition: owner-terminal
  group: owner
  cardinality: {min: 0, max: 1}
  lifecycle: owner-only
  session_names: [Owner Terminal]
  notes: Runs commands reserved to the owner, each approved in its manual mode. Never launched or
    stopped by the Replicator (owner ruling, 2026-10-12).
