# Control repository CI. Guide: docs/guides/OPS-001-branching-and-ci.md.
#
# One job, `verify`. It never deploys, never calls AWS or Bedrock, and never commits.
# A red run on dev or main is an alarm: fix it forward with a new commit.
name: control-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "agent/**"]

concurrency:
  group: control-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check tools/ test/

      # No scaffold step: doctor reports the gitignored .idea-realization/staging/ directory, which a
      # fresh checkout lacks, as absent and does not fail on it, and running the scaffold here would
      # rewrite the tracked install-state.json. IDEA_REALIZATION_ROOT is set on the doctor and check
      # steps only: the plugin tests create their own temporary repositories and fail if it points
      # them at this checkout.
      - name: Doctor
        env:
          IDEA_REALIZATION_ROOT: ${{ github.workspace }}
        run: uv run plugins/idea-realization/scripts/doctor.py

      # No product root is configured in CI, so the product checks cannot run here: the reviews
      # check prints "product_merge ... not checked" for each complete phase, and those lines
      # do not fail the run.
      - name: Repository check
        env:
          IDEA_REALIZATION_ROOT: ${{ github.workspace }}
        run: uv run plugins/idea-realization/scripts/check.py

      - name: Folder tests
        run: uv run pytest -q test

      - name: Plugin tests
        working-directory: plugins/idea-realization
        run: uv run pytest -q

      # The deny-list is the repository secret DENY_LIST, one identifier per line. It is written
      # to the runner's temporary directory, never to the workspace, and removed afterwards.
      # check_confidential.py reads its path from PRIVATE_DENY_LIST (tools/check_confidential.py).
      # Without the secret the step fails, as product CI does: a run that could not look for the
      # identifiers has not shown that none are present. A pull request from a fork gets no
      # secrets, so it fails here too.
      - name: Private-content check
        env:
          DENY_LIST: ${{ secrets.DENY_LIST }}
        run: |
          if [ -z "$DENY_LIST" ]; then
            echo "::error::The repository secret DENY_LIST is not set. The repository owner sets it: gh secret set DENY_LIST < .private/deny-list.txt"
            exit 1
          fi
          deny_file="$RUNNER_TEMP/deny-list.txt"
          printf '%s\n' "$DENY_LIST" | tr -d '\r' > "$deny_file"
          # A violation line names the identifier it matched; mask every entry so the log
          # never shows one.
          while IFS= read -r line; do
            entry=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            case "$entry" in ''|'#'*) continue ;; esac
            echo "::add-mask::$entry"
          done < "$deny_file"
          export PRIVATE_DENY_LIST="$deny_file"
          status=0
          uv run python tools/check_confidential.py || status=$?
          rm -f "$RUNNER_TEMP/deny-list.txt"
          exit "$status"
