# Control repository CI. Guide: docs/guides/OPS-001-branching-and-ci.md.
#
# One job, `verify`. It never deploys, never calls AWS or Bedrock, and never commits.
# A red run on dev or main is an alarm: fix it forward with a new commit.
name: control-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, "agent/**"]

concurrency:
  group: control-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials is off: no later step uses git credentials for this repository (the
      # only network git call, the reviews check's ls-remote, goes to the product checkout), so
      # the job token is not left in the checkout's git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check tools/ test/

      # No scaffold step: doctor reports the gitignored .idea-realization/staging/ directory, which a
      # fresh checkout lacks, as absent and does not fail on it, and running the scaffold here would
      # rewrite the tracked install-state.json. IDEA_REALIZATION_ROOT is set on the doctor and check
      # steps only: the plugin tests create their own temporary repositories and fail if it points
      # them at this checkout.
      - name: Doctor
        env:
          IDEA_REALIZATION_ROOT: ${{ github.workspace }}
        run: uv run plugins/idea-realization/scripts/doctor.py

      # The repository check verifies each complete phase's product_merge against the product
      # repository itself, so CI checks the product out read-only. Two settings, both on this
      # control repository (docs/guides/OPS-001-branching-and-ci.md, "Secrets"):
      #   - secret PRODUCT_READ_TOKEN: a token that can only read the product repository;
      #   - variable PRODUCT_GITHUB: the product repository as <org>/<repo>. When unset, the
      #     product_github configured in .idea-realization/product.yaml (github:) is used.
      # Without either the run fails, as with DENY_LIST: a run that could not read the product
      # repository has not shown that the recorded merges are real. A pull request from a fork
      # gets no secrets, so it fails here too.
      - name: Product repository settings
        id: product
        env:
          IDEA_REALIZATION_ROOT: ${{ github.workspace }}
          IDEA_REALIZATION_PRODUCT_GITHUB: ${{ vars.PRODUCT_GITHUB }}
          PRODUCT_READ_TOKEN: ${{ secrets.PRODUCT_READ_TOKEN }}
        run: |
          if [ -z "$PRODUCT_READ_TOKEN" ]; then
            echo "::error::The repository secret PRODUCT_READ_TOKEN is not set (a pull request from a fork never receives it). The repository owner creates a read-only token for the product repository and sets it: gh secret set PRODUCT_READ_TOKEN. See docs/guides/OPS-001-branching-and-ci.md."
            exit 1
          fi
          github=$(uv run plugins/idea-realization/scripts/paths.py | sed -n 's/^product_github: //p')
          if [ -z "$github" ]; then
            echo "::error::The product repository is not named. Set the repository variable PRODUCT_GITHUB to <org>/<repo> (gh variable set PRODUCT_GITHUB --body <org>/<repo>), or github: in .idea-realization/product.yaml."
            exit 1
          fi
          branch=$(uv run python -c 'import yaml; print(yaml.safe_load(open(".idea-realization/product.yaml", encoding="utf-8"))["integration_branch"])')
          echo "github=$github" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Full history of every branch, so the reviews check can read a merge commit's parents and
      # whether it is on the integration branch. persist-credentials is off: the token is not
      # left in the checkout's git config for the steps that follow.
      - name: Check out the product repository (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.product.outputs.github }}
          ref: ${{ steps.product.outputs.branch }}
          token: ${{ secrets.PRODUCT_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .product-checkout

      # actions/checkout only writes under the workspace, and product_root must be outside the
      # control checkout (paths.py), so the checkout moves to the runner's temporary directory.
      - name: Move the product checkout out of the control checkout
        run: mv "$GITHUB_WORKSPACE/.product-checkout" "$RUNNER_TEMP/product"

      # IDEA_REALIZATION_REQUIRE_PRODUCT makes a missing product checkout, or a merge whose
      # landing cannot be told, an error rather than a note (scripts/checks/reviews.py). The
      # token reaches git only in this step, as an HTTP header for github.com, for the reviews
      # check's git ls-remote of the product's origin.
      - name: Repository check
        env:
          IDEA_REALIZATION_ROOT: ${{ github.workspace }}
          IDEA_REALIZATION_REQUIRE_PRODUCT: "1"
          IDEA_REALIZATION_PRODUCT_ROOT: ${{ runner.temp }}/product
          IDEA_REALIZATION_PRODUCT_GITHUB: ${{ steps.product.outputs.github }}
          IDEA_REALIZATION_PRODUCT_REMOTE: ${{ github.server_url }}/${{ steps.product.outputs.github }}
          PRODUCT_READ_TOKEN: ${{ secrets.PRODUCT_READ_TOKEN }}
        run: |
          header=$(printf 'x-access-token:%s' "$PRODUCT_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          uv run plugins/idea-realization/scripts/product.py verify
          uv run plugins/idea-realization/scripts/check.py

      - name: Folder tests
        run: uv run pytest -q test

      - name: Plugin tests
        working-directory: plugins/idea-realization
        run: uv run pytest -q

      # The deny-list is the repository secret DENY_LIST, one identifier per line. It is written
      # to the runner's temporary directory, never to the workspace, and removed afterwards.
      # check_confidential.py reads its path from PRIVATE_DENY_LIST (tools/check_confidential.py).
      # Without the secret the step fails, as product CI does: a run that could not look for the
      # identifiers has not shown that none are present. A pull request from a fork gets no
      # secrets, so it fails here too.
      - name: Private-content check
        env:
          DENY_LIST: ${{ secrets.DENY_LIST }}
        run: |
          if [ -z "$DENY_LIST" ]; then
            echo "::error::The repository secret DENY_LIST is not set. The repository owner sets it: gh secret set DENY_LIST < .private/deny-list.txt"
            exit 1
          fi
          deny_file="$RUNNER_TEMP/deny-list.txt"
          printf '%s\n' "$DENY_LIST" | tr -d '\r' > "$deny_file"
          # A violation line names the identifier it matched; mask every entry so the log
          # never shows one.
          while IFS= read -r line; do
            entry=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            case "$entry" in ''|'#'*) continue ;; esac
            echo "::add-mask::$entry"
          done < "$deny_file"
          export PRIVATE_DENY_LIST="$deny_file"
          status=0
          uv run python tools/check_confidential.py || status=$?
          rm -f "$RUNNER_TEMP/deny-list.txt"
          exit "$status"
