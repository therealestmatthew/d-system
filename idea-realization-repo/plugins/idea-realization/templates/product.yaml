schema_version: 1
# The product repository this control repository drives. Only what is the same on every machine:
# each developer sets the local checkout path in .idea-realization/local.yaml (or with
# IDEA_REALIZATION_PRODUCT_ROOT), never here.
# The product repository's URL and GitHub name are not tracked here: they can name a confidential
# organization. Each machine sets product_remote and product_github in its untracked
# .idea-realization/local.yaml (template: local.example.yaml); product.py verify refuses to act
# until product_remote is set. A team whose URL may be tracked can add remote: and github: here
# instead; local.yaml still overrides them.
name: product
integration_branch: main
ci_workflow: none
