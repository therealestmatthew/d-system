schema_version: 1
# What the whole team shares about this control repository (schemas/project.schema.json).
# What differs per machine goes in the untracked .idea-realization/local.yaml instead.
# A value that starts with REPLACE-WITH- is a placeholder: scripts treat it as unset.
# The control repository's URL and GitHub name are not tracked here: they can name a confidential
# organization. Each machine sets control_remote and control_github in its untracked
# .idea-realization/local.yaml (template: local.example.yaml). A team whose URL may be tracked can
# add control.remote and control.github below instead; local.yaml still overrides them.
control:
  integration_branch: main
# Optional sections; dates are quoted YYYY-MM-DD.
# demo:
#   date: 'YYYY-MM-DD'
#   freeze: 'YYYY-MM-DD'
#   tag_prefix: demo-
# urls:
#   hackathon_portal: REPLACE-WITH-THE-HACKATHON-PORTAL-URL
#   demo_app: REPLACE-WITH-THE-DEMO-APP-URL
#   team_chat: REPLACE-WITH-THE-TEAM-CHAT-URL
# aws:
#   region: REPLACE-WITH-THE-TEAM-AWS-REGION
