- id: phase-ux-01
  title: Kit gallery generator and browser test harness for every REQ-001 row
  plan: doc-ux-kit-plan
  sources:
  - doc-ux-kit-requirements
  - doc-ux-design-guide
  systems:
  - sys-ui-kit
  owner: repository-owner
  status: queued
  priority: 1
  session_budget: 1
  depends_on: []
  scope:
  - Generate the gallery index and one page per component from the catalogue markup, in light and dark.
  - Add one command that builds the gallery and runs the Python, component and browser tests.
  - Add browser tests for axe, focus rings, request origins, candidate accents and shell fit at 1024x768,
    1280x720, 1366x768 and 1920x1080, plus keyboard specs for the dialog, tabs and toast Kit v0 shipped.
  - Add a test for any REQ-001 row Kit v0 left without one, each with the fixture that must fail.
  acceptance:
  - One command builds the gallery and runs every test, and exits nonzero when any test fails.
  - axe reports zero serious or critical issues on every gallery page in both themes.
  - Each REQ-001 row from R01 to R09, R11 and R13 has a test that rejects its failing fixture.
  verification:
  - 'control: uv run --with pytest pytest -q ui-kit/test'
  - 'control: cd ui-kit && npx playwright test'
  - 'control: uv run plugins/idea-realization/scripts/check.py'
  deliverables:
  - ui-kit/tools/build_gallery.py
  - ui-kit/gallery/
  - ui-kit/test/
  - ui-kit/playwright.config.ts
  - ui-kit/package.json
  next_action: Read what Kit v0 shipped under ui-kit/test/ and ui-kit/gallery/, then list the REQ-001 rows
    with no test yet.
