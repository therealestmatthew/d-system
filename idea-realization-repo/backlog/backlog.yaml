  scope:
  - Add typed bar elements (help, action, choice, toggle, status) that a panel places into its frame's sub-slots,
    throwing on a type the slot does not admit; replace the plain controls content of Panel.
  - Add the panel registry, the status strip component for the strip region and the app theme toggle component.
    (Transient maximize and collapse, the per-panel error boundary with Retry, the skip link and F6 cycling
    shipped in Kit v0.)
  - Add the test that compares React-rendered classes and state attributes with the catalogue (REQ-001 R12).
  acceptance:
  - An unadmitted bar element type shows in that panel's error boundary and leaves other panels working.
  - The shell-fit test passes for every layout in ui-kit/layouts/ at the four sizes, and the R12 class comparison
    test passes and fails on a component that renders a class absent from the catalogue.
