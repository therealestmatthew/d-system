- id: phase-boot-03
  title: Review runner, test baseline, diff patterns and CI gate for the product stack
  plan: doc-bootstrap-follow-ons
  sources: []
  systems:
  - sys-control-tools
  owner: repository-owner
  status: queued
  priority: 2
  session_budget: 1
  depends_on: []
  scope:
  - Run the phase's verification in the product worktree and record the evidence the reviewers read.
  - Compare test results against the product integration branch, refuse risky diff patterns, and poll
    the product CI.
  acceptance:
  - A review can cite the runner's recorded output instead of re-running every command.
  - A test that passed on the integration branch and fails on the branch blocks the merge.
  verification:
  - 'control: uv run pytest -q'
  - 'control: uv run plugins/idea-realization/scripts/check.py'
  deliverables:
  - tools/
  next_action: Wait until the product's language and test runner are chosen, then adapt the existing review
    runner design to them.
