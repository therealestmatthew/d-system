- id: phase-boot-01
  title: Author-scoped document codes, session codes and phase ids
  plan: doc-bootstrap-follow-ons
  sources: []
  systems:
  - sys-pipeline
  owner: repository-owner
  status: queued
  priority: 1
  session_budget: 1
  depends_on: []
  scope:
  - Make every allocated document and session code carry the allocating developer's handle, and phase
    ids too.
  - Keep code reservations for one developer's concurrent agents on one machine.
  acceptance:
  - Two developers allocating a plan code offline receive different codes.
  - The documents check accepts the author-scoped forms and rejects a code without a handle.
  verification:
  - 'control: cd plugins/idea-realization && uv run --with pytest pytest -q'
  - 'control: uv run plugins/idea-realization/scripts/check.py'
  deliverables:
  - plugins/idea-realization/scripts/codes.py
  - plugins/idea-realization/scripts/reservations.py
  - plugins/idea-realization/templates/codes.yaml
  - plugins/idea-realization/schemas/
  - plugins/idea-realization/test/
  next_action: Read scripts/codes.py's allocation and decide the code form with the owner before changing
    it.
