- id: phase-ux-07
  title: React forms and inputs on React Aria
  plan: doc-ux-kit-plan
  sources:
  - doc-ux-kit-requirements
  - doc-ux-design-guide
  systems:
  - sys-ui-kit
  owner: repository-owner
  status: queued
