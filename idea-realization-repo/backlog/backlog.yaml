- id: phase-ux-05
  title: React app shell completion with typed bar elements and transient frame actions
  plan: doc-ux-kit-plan
  sources:
  - doc-ux-kit-requirements
  - doc-ux-design-guide
  systems:
  - sys-ui-kit
  owner: repository-owner
  status: queued
  priority: 2
  session_budget: 1
  depends_on:
