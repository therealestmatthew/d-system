    and filter, in-page search with the / shortcut, the theme toggle and copy.
  - Declare each behaviour in ui-kit/components.yaml and add its gallery page and keyboard spec.
  - Measure the gzip size of dist/ui.js in a test.
  acceptance:
  - dist/ui.js is at most 8 KB gzip, and a test fails when it grows past that.
  - Filtering 1,000 static table rows takes at most 50 ms, measured in the browser test.
