    and the review judge read.
  - 'Compare the branch''s test results with product dev''s and refuse risky diff patterns. (The product
    CI verify job, its required check and the CI wait in session-close already exist: docs/guides/OPS-001.)'
  acceptance:
  - A review can cite the runner's recorded output instead of re-running every command.
