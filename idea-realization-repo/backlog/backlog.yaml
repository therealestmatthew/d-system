- id: phase-ux-03
  title: Static disclosure and data behaviours in ui.js within 8 KB gzip
  plan: doc-ux-kit-plan
  sources:
  - doc-ux-kit-requirements
  - doc-ux-design-guide
  systems:
  - sys-ui-kit
  owner: repository-owner
  status: queued
  priority: 2
  session_budget: 1
  depends_on:
  - phase-ux-02
  scope:
  - Add accordion deep-link opening and expand-all, JavaScript tabs beside the CSS-only tabs, table sort
    and filter, in-page search with the / shortcut, the theme toggle and copy.
  - Declare each behaviour in ui-kit/components.yaml and add its gallery page and keyboard spec.
  - Measure the gzip size of dist/ui.js in a test.
  acceptance:
  - dist/ui.js is at most 8 KB gzip, and a test fails when it grows past that.
  - Filtering 1,000 static table rows takes at most 50 ms, measured in the browser test.
  - The theme toggle sets data-theme on the root, and REQ-001 R04's test passes.
  verification:
  - 'control: uv run --with pytest pytest -q ui-kit/test'
  - 'control: cd ui-kit && npx playwright test'
  - 'control: uv run plugins/idea-realization/scripts/check.py'
  deliverables:
  - ui-kit/src/behaviours/
  - ui-kit/dist/ui.js
  - ui-kit/components.yaml
  - ui-kit/src/css/components/
  - ui-kit/gallery/
  - ui-kit/test/
  next_action: Start with the table sort and filter and its 1,000-row timing, since it is the behaviour
    most likely to miss its budget.
