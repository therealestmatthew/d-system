schema_version: 1
# The code register. Series definitions are the only source of truth for prefix, numbering and
# location; locations are relative to the document root. Never edit a code into a document by
# hand: allocate it with the next-code command.
# Every series is scoped unless it says scoped: false: a new code carries the allocating
# developer's handle after the prefix and numbers per handle, so developers on separate
# machines never take the same code. A code without a handle stays valid only when the legacy
# list below names it. Governance is unscoped because its rules are the team's, written by the
# repository owner.
series:
- code: PLAN
  kind: plan
  locations:
  - plans/
  numbering: counter
  sub_codes: true
- code: REQ
  kind: requirement
  locations:
  - requirements/
  numbering: counter
  sub_codes: false
- code: ADR
  kind: adr
  locations:
  - decisions/
  numbering: counter
  sub_codes: false
- code: ARCH
  kind: architecture
  locations:
  - architecture/
  numbering: counter
  sub_codes: false
- code: PROMPT
  kind: prompt
  locations:
  - prompts/
  numbering: counter
  sub_codes: false
- code: OPS
  kind: operation
  locations:
  - governance/
  - guides/
  numbering: counter
  sub_codes: false
- code: GOV
  kind: governance
  locations:
  - governance/
  numbering: counter
  sub_codes: false
  scoped: false
- code: SESS
  kind: session
  locations:
  - sessions/
  numbering: dated
  sub_codes: false
- code: WALK
  kind: walkthrough
  locations:
  - sessions/
  numbering: dated
  sub_codes: false
# Codes held for a planned document before it exists. Allocation skips these.
reserved: []
# Codes withdrawn from use. Never reissued.
retired: []
# Codes without a developer handle in a scoped series, written before the series was scoped.
# Only these, and sub-codes under them, stay valid without a handle. Nothing new is added here:
# a new code comes from next-code and carries a handle. An unscoped series (GOV) needs no entry.
legacy:
- ADR-001
- ARCH-001
- ARCH-002
- OPS-001
- OPS-002
- OPS-003
- OPS-004
- OPS-005
- OPS-006
- OPS-007
- OPS-008
- OPS-009
- OPS-010
- PLAN-001
- PLAN-002
- PLAN-003
- REQ-001
