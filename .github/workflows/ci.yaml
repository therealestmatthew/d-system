name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: No private content leaked into the tracked tree
        run: uv run python tools/check_no_private_content.py
      # Before the governance step, so a stale catalog fails a step named for it. --catalog
      # rewrites the file in the checkout; git diff then compares it with the committed copy
      # (REQ-028 R03, PLAN-045 D4).
      - name: Catalog is current
        run: |
          uv run python -m src.governance --catalog > /dev/null
          git diff --exit-code docs/08-governance/catalog.md
      - run: uv run python -m src.governance
      - run: uv run ruff check src/ test/
      - run: uv run mypy src/
      - run: uv run pytest

  frontend:
    name: TypeScript build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm run build
