[project]
name = "d-system"
version = "0.1.0"
description = "Consulting Management System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    # DuckDB needs pytz to hand a TIMESTAMP WITH TIME ZONE back to Python. Without it,
    # any query returning idea_events.occurred_at or ideas.created raises rather than
    # returning a row. Nothing in this repository imports pytz directly, so it looks
    # unused — it is not.
    "pytz>=2024.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # ConPTY backend for the demo terminal adapter (ADR-013 section 4, src/demo/windows.py).
    # Windows-only: this marker keeps Linux/macOS installs from ever pulling it.
    "pywinpty>=2.0.14; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
